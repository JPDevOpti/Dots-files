misc {
    vrr = 0  # Disabled: triggers amdgpu dcn31 compbuf bug with mixed refresh rates (144Hz eDP + 60Hz externals)

    animate_manual_resizes = false
    animate_mouse_windowdragging = false

    disable_hyprland_logo = true
    force_default_wallpaper = 0

    on_focus_under_fullscreen = 2
    allow_session_lock_restore = true
    middle_click_paste = false
    focus_on_activate = true
    session_lock_xray = true

    mouse_move_enables_dpms = true
    key_press_enables_dpms = false  # Disabled: each keystroke was firing a DPMS-on commit and triggering the amdgpu dcn31 flicker. Mouse can still wake the screen.

	background_color = rgb($surfaceContainer)
}

debug {
    error_position = 1
}
