add_newline = true
command_timeout = 500
format = """
$directory$git_branch$git_status$cmd_duration
$character"""

[character]
error_symbol = "[❯](bold red)"
success_symbol = "[❯](bold cyan)"
vimcmd_symbol = "[❮](bold green)"

[directory]
truncation_length = 3
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
style = "cyan"
read_only = " 󰌾"

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "italic bright-cyan"
truncation_length = 30

[git_status]
format = '([$all_status]($style))'
style = "cyan"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "󰩙 "
up_to_date = ""
untracked = "[?](dimmed cyan)"
modified = "[!](yellow)"
staged = "[+](green)"
renamed = "[»](cyan)"
deleted = "[-](red)"
stashed = "[≡](blue) "

[cmd_duration]
format = " [$duration]($style)"
style = "dimmed yellow"
min_time = 2_000
show_notifications = false

[nodejs]
format = "[ $version]($style) "
style = "dimmed green"
detect_files = ["package.json", ".nvmrc"]

[python]
format = "[ $version]($style) "
style = "dimmed yellow"

[rust]
format = "[ $version]($style) "
style = "dimmed red"

[golang]
format = "[ $version]($style) "
style = "dimmed cyan"

[docker_context]
format = "[ $context]($style) "
style = "dimmed blue"
only_with_files = true
