[Service]
# Put the native Claude Code binary (managed by mise) ahead of the bash wrapper in
# ~/.local/bin, so OpenClaw's claude-cli backend can bind a self-contained executable.
Environment=PATH=/home/jpdevopti/.local/share/mise/installs/claude/latest:/home/jpdevopti/.openclaw/tools/node-v24.19.0/bin:/usr/local/bin:/usr/bin:/bin:/home/jpdevopti/.local/bin:/home/jpdevopti/.npm-global/bin:/home/jpdevopti/bin
