# ── Liberar atajos del default que se reasignan aquí ─────────────────────────
unbind = SUPER, W          # era: Close window      → reasignado a Browser
unbind = SUPER, S          # era: Toggle scratchpad → reasignado a Screenshot región
unbind = SUPER, F          # era: Full screen       → reasignado a Super+X
unbind = SUPER, X          # era: Universal cut     → reasignado a Pantalla completa
unbind = SUPER, C          # era: Universal copy    → reasignado a Pop out
unbind = SUPER, V          # era: Universal paste   → reasignado a Toggle split
unbind = SUPER, O          # era: Pop out           → reasignado a Super+C
unbind = SUPER, J          # era: Toggle split      → reasignado a Super+V
unbind = SUPER, L          # era: Toggle layout     → reasignado a Super+B

# ── Ventanas (personalizados) ─────────────────────────────────────────────────
bindd = SUPER, X, Pantalla completa, fullscreen, 0
bindd = SUPER, C, Pop out (flotar y fijar), exec, omarchy-hyprland-window-pop
bindd = SUPER, V, Toggle split, layoutmsg, togglesplit
bindd = SUPER, B, Toggle layout del workspace, exec, omarchy-hyprland-workspace-layout-toggle

# ── Ventanas ──────────────────────────────────────────────────────────────────
bindd = SUPER, Z, Cerrar ventana activa, killactive

# ── Capturas y herramientas visuales ─────────────────────────────────────────
bindd = SUPER, S, Captura región → portapapeles, exec, omarchy-capture-screenshot region copy
bindd = SUPER, A, Selector de color → portapapeles, exec, pkill hyprpicker || hyprpicker -a

# ── Apps principales ──────────────────────────────────────────────────────────
bindd = SUPER, Q,       Terminal,              exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, Q, Terminal + Tmux,       exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER, W,       Browser,               exec, omarchy-launch-browser
bindd = SUPER SHIFT, W, Browser (privado),     exec, omarchy-launch-browser --private
bindd = SUPER, R,       Editor (Zed),          exec, uwsm-app -- zed
bindd = SUPER, E,       Explorador de archivos, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT, E,   Explorador (directorio actual), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"

# ── Apps secundarias ──────────────────────────────────────────────────────────
bindd = SUPER SHIFT, M, Música (Spotify),   exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT, D, Docker,             exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, O, Obsidian,           exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"
bindd = SUPER SHIFT, SLASH, Contraseñas,    exec, uwsm-app -- 1password
bindd = SUPER SHIFT, I, Claude (IA),        exec, uwsm-app -- xdg-terminal-exec bash -c "claude"

