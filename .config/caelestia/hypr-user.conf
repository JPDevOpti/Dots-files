# User overrides (loaded last)

# Launcher: abrir también con Super+Space (además del tap de Super solo)
# Usa un shortcut propio (launcherToggle) que abre/cierra al presionar,
# en vez de "launcher" que solo actúa al soltar la tecla (pensado para el
# tap de Super_L) y por eso se cerraba al soltar Super.
bind = Super, Space, global, caelestia:launcherToggle

# Color picker: mover de Super+Shift+C (default caelestia) a Super+Shift+A
unbind = Super+Shift, C
bind = Super+Shift, A, exec, hyprpicker -a  # Colour picker (copia al portapapeles)

# --- Multi-GPU + cursor (añadido 2026-05-21) ---
# Portátil híbrido: AMD iGPU mueve eDP-1; NVIDIA RTX 4050 mueve los
# externos (HDMI-A-1 / DP-7). El cursor por hardware fallaba al copiarse
# entre GPUs ("Backend requires blit, but cursor blit failed", cientos de
# errores por minuto). Valor 2 = auto: usa HW donde funciona (eDP) y
# software donde no (externos NVIDIA). Sube a 1 si quedara spam residual.
cursor {
    no_hardware_cursors = 2
}

# Red de seguridad: cualquier monitor no listado en monitors.conf arranca
# en su modo preferido (los named rules de nwg-displays tienen prioridad).
monitor = , preferred, auto, 1.0
