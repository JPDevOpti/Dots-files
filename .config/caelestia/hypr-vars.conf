# Override keybinds
$kbTerminal = Super, Q
$kbCloseWindow = Super, C
$kbEditor = Super, grave  # desplazado para liberar Super+C
$kbZedEditor = Super, F
$kbCopilot = Super, D
$kbWindowFullscreen = Super+Shift, F

# Override apps
$fileExplorer = thunar
env = XCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
